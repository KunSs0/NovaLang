plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '8.3.9'
}

description = 'NovaLang Bukkit runtime plugin and scheduler integration'

repositories {
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
}

def bukkitApiGroup = findProperty('bukkitApiGroup') ?: 'io.papermc.paper'
def bukkitApiArtifact = findProperty('bukkitApiArtifact') ?: 'paper-api'
def bukkitApiVersion = findProperty('bukkitApiVersion') ?: '1.21.8-R0.1-SNAPSHOT'
def mockBukkitCoordinate = findProperty('mockBukkitCoordinate') ?: 'com.github.seeseemelk:MockBukkit-v1.21:3.133.2'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


sourceSets {
    mockBukkitTest {
        java.srcDir('src/mockBukkitTest/java')
        resources.srcDir('src/mockBukkitTest/resources')
        compileClasspath = sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath = output + compileClasspath
    }
}

dependencies {
    api project(':nova-bukkit:core')
    api project(':nova-bukkit:paper-1_21')
    api project(':nova-bukkit:bukkit-1_12')
    api project(':nova-runtime-workspace')
    api project(':nova-mock')
    compileOnly("${bukkitApiGroup}:${bukkitApiArtifact}:${bukkitApiVersion}")
    testImplementation("${bukkitApiGroup}:${bukkitApiArtifact}:${bukkitApiVersion}")
    if (mockBukkitCoordinate != null && !mockBukkitCoordinate.trim().isEmpty()) {
        add('mockBukkitTestImplementation', mockBukkitCoordinate) {
            transitive = true
        }
    }
}

tasks.register('mockBukkitTest', Test) {
    description = 'Runs the real Bukkit event registration test for the selected Bukkit/MockBukkit profile.'
    group = 'verification'
    testClassesDirs = sourceSets.mockBukkitTest.output.classesDirs
    classpath = sourceSets.mockBukkitTest.runtimeClasspath
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    onlyIf {
        mockBukkitCoordinate != null && !mockBukkitCoordinate.trim().isEmpty()
    }
}

tasks.register('assembleVersionedModules', Copy) {
    group = 'distribution'
    description = 'Assembles the cross-version core and selected Bukkit platform modules.'
    dependsOn(':nova-bukkit:core:jar', ':nova-bukkit:paper-1_21:jar')
    dependsOn(':nova-bukkit:bukkit-1_12:jar')
    from(project(':nova-bukkit:core').tasks.named('jar'))
    from(project(':nova-bukkit:paper-1_21').tasks.named('jar'))
    from(project(':nova-bukkit:bukkit-1_12').tasks.named('jar'))
    into(layout.buildDirectory.dir('versioned-modules'))
}

tasks.assemble.dependsOn(tasks.named('assembleVersionedModules'))

tasks.register('assembleSingleJar') {
    group = 'distribution'
    description = 'Builds the single deployable NovaLang Bukkit runtime JAR.'
    dependsOn(shadowJar)
}

tasks.assemble.dependsOn(tasks.named('assembleSingleJar'))

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

// Bukkit 服务端只安装一个完整产物，业务插件通过硬依赖共享 NovaLang 类加载器。
shadowJar {
    archiveBaseName.set('NovaLang')
    archiveClassifier.set('')
    mergeServiceFiles()

    // 重定位第三方依赖，避免与服务端和业务插件携带的版本产生类冲突。
    relocate 'com.github.benmanes.caffeine', 'com.novalang.deps.caffeine'
    relocate 'org.checkerframework', 'com.novalang.deps.checkerframework'
    relocate 'fi.iki.elonen', 'com.novalang.deps.nanohttpd'
    relocate 'org.objectweb.asm', 'com.novalang.deps.asm'
    relocate 'org.yaml.snakeyaml', 'com.novalang.deps.snakeyaml'
    relocate 'com.google.gson', 'com.novalang.deps.gson'

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

jar.enabled = false

// 业务插件以 compileOnly 方式消费与服务端部署完全一致的 NovaLang 产物。
publishing {
    publications {
        shadow(MavenPublication) {
            groupId = project.group
            artifactId = project.name
            version = project.version
            artifact shadowJar
        }
    }
}

tasks.register('verifyPluginJar') {
    group = 'verification'
    description = 'Verifies that the deployable NovaLang Bukkit JAR contains its plugin metadata and runtime.'
    dependsOn shadowJar

    doLast {
        File pluginJar = shadowJar.archiveFile.get().asFile
        if (!zipTree(pluginJar).matching { include 'plugin.yml' }.files) {
            throw new GradleException('The NovaLang Bukkit JAR does not contain plugin.yml.')
        }
        if (!zipTree(pluginJar).matching { include 'com/novalang/bukkit/NovaBukkitPlugin.class' }.files) {
            throw new GradleException('The NovaLang Bukkit JAR does not contain its plugin main class.')
        }
        if (!zipTree(pluginJar).matching { include 'com/novalang/workspace/RuntimeWorkspace.class' }.files) {
            throw new GradleException('The NovaLang Bukkit JAR does not contain the workspace runtime.')
        }
        if (!zipTree(pluginJar).matching { include 'com/novalang/workspace/WorkspaceScheduleContext.class' }.files) {
            throw new GradleException('The NovaLang Bukkit JAR does not contain Workspace schedule support.')
        }
        if (!zipTree(pluginJar).matching { include 'com/novalang/workspace/WorkspaceConfigFiles.class' }.files) {
            throw new GradleException('The NovaLang Bukkit JAR does not contain Workspace config support.')
        }
        if (!zipTree(pluginJar).matching { include 'com/novalang/bukkit/BukkitEventRegistrar.class' }.files) {
            throw new GradleException('The NovaLang Bukkit JAR does not contain Bukkit event registrar support.')
        }
        if (!zipTree(pluginJar).matching { include 'com/novalang/bukkit/NoBukkit.class' }.files) {
            throw new GradleException('The NovaLang Bukkit JAR does not contain the NoBukkit facade.')
        }
        if (!zipTree(pluginJar).matching { include 'com/novalang/bukkit/EventRegistration.class' }.files) {
            throw new GradleException('The NovaLang Bukkit JAR does not contain event registration handles.')
        }
    }
}

tasks.build.dependsOn shadowJar
tasks.build.dependsOn tasks.named('verifyPluginJar')
