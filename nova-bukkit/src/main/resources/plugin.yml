name: NovaLang
version: '${version}'
main: com.novalang.bukkit.NovaBukkitPlugin
api-version: '1.21'
load: STARTUP
authors:
  - NovaLang
description: NovaLang runtime and project platform for Bukkit and Paper plugins.
commands:
  nova:
    description: NovaLang Program 管理和单元测试
    usage: /nova test <测试文件|项目目录> [--report=<文件>]
    permission: novalang.test
permissions:
  novalang.test:
    description: 运行 NovaLang 项目单元测试
    default: op
